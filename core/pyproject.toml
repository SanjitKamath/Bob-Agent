[project]
name = "bobd"
version = "0.1.0"
description = "Bob core service: models, routing, memory, safety, plugin management, API."
requires-python = ">=3.12"
dependencies = [
    "bob-plugin-sdk",
    "pydantic-ai-slim[openai,mcp]>=2.0",
    "mcp>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "pyyaml>=6",
    "httpx>=0.27",
    "typer>=0.12",
    "keyring>=25",
    "numpy>=2",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.20",
]

[project.scripts]
bob = "bobd.cli:app"
bobd = "bobd.service:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bobd"

[tool.uv.sources]
bob-plugin-sdk = { workspace = true }
