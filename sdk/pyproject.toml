[project]
name = "bob-plugin-sdk"
version = "0.1.0"
description = "Manifest schema, MCP helpers and test kit for Bob plugins."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "mcp>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_sdk"
