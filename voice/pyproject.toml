[project]
name = "bob-voice"
version = "0.1.0"
description = "Bob's speech helper: turns audio from the app into text with Whisper, on this Mac."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "certifi",
    "pywhispercpp>=1.5.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_voice"
