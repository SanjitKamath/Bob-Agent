[project]
name = "bob-mail"
version = "0.1.0"
description = "Bob plugin: mail triage, summaries and draft replies."
requires-python = ">=3.12"
dependencies = [
    "bob-plugin-sdk",
    "imapclient>=3.0",
    "keyring>=25",
    "beautifulsoup4>=4.12",
]

[project.entry-points."bob.plugins"]
mail = "bob_mail"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_mail"

[tool.uv.sources]
bob-plugin-sdk = { workspace = true }
