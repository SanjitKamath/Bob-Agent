[project]
name = "bob-web"
version = "0.1.0"
description = "Bob plugin: search the web, read a page, get the weather."
requires-python = ">=3.12"
dependencies = [
    "bob-plugin-sdk",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.entry-points."bob.plugins"]
web = "bob_web"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_web"

[tool.uv.sources]
bob-plugin-sdk = { workspace = true }
