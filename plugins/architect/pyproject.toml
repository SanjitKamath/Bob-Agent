[project]
name = "bob-architect"
version = "0.1.0"
description = "Bob plugin: diagrams, ADRs and design notes grounded in your collections."
requires-python = ">=3.12"
dependencies = [
    "bob-plugin-sdk",
]

[project.entry-points."bob.plugins"]
architect = "bob_architect"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_architect"

[tool.uv.sources]
bob-plugin-sdk = { workspace = true }
