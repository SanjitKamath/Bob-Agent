[project]
name = "bob-documents"
version = "0.1.0"
description = "Bob plugin: parses PDF, DOCX and images."
requires-python = ">=3.12"
dependencies = [
    "bob-plugin-sdk",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.entry-points."bob.plugins"]
documents = "bob_documents"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bob_documents"

[tool.uv.sources]
bob-plugin-sdk = { workspace = true }
